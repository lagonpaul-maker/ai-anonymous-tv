<!DOCTYPE html>
<html>
<head>
  <title>Anonymous AI TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Ethical Ads -->
  <script async src="https://media.ethicalads.io/media/client/ethicalads.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 10px;
      font-size: 18px;
      letter-spacing: 2px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    /* ANIMATION */
    #animation {
      width: 100%;
      height: 60vh;
      background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffcc);
      background-size: 600% 600%;
      animation: gradientFlow 8s ease infinite;
      position: relative;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* PARTICLES */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      opacity: 0.5;
      border-radius: 50%;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }

    /* ADS */
    .ad {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #111;
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .bottom-ad {
      position: sticky;
      bottom: 0;
      background: #111;
      padding: 10px;
      border-top: 1px solid #333;
    }

    /* BUTTON */
    .controls {
      text-align: center;
      margin: 10px;
    }

    button {
      padding: 10px 15px;
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* ABOUT */
    .about {
      padding: 20px;
      max-width: 700px;
      margin: auto;
      color: #ccc;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="header">ANONYMOUS AI TV</div>

<!-- TOP AD -->
<div class="ad">
  <div data-ea-publisher="YOUR_ID" data-ea-type="image"></div>
</div>

<!-- ANIMATION -->
<div id="animation"></div>

<!-- CONTROLS -->
<div class="controls">
  <button onclick="toggleMusic()">🔊 Sound</button>
</div>

<!-- BOTTOM AD -->
<div class="bottom-ad">
  <div data-ea-publisher="YOUR_ID" data-ea-type="image"></div>
</div>

<!-- ABOUT -->
<div class="about">
  <h2>Privacy First</h2>
  <p>
    No login. No tracking. No data collection.
    Just continuous content and a clean viewing experience.
  </p>
</div>

<!-- AUDIO -->
<audio id="bgMusic" loop>
  <source src="your-audio-link.mp3" type="audio/mpeg">
</audio>

<script>
// 🎧 AUDIO
const audio = document.getElementById("bgMusic");
audio.volume = 0.2;

document.body.addEventListener("click", () => {
  audio.play();
}, { once: true });

function toggleMusic() {
  if (audio.paused) audio.play();
  else audio.pause();
}

// ✨ PARTICLES
const container = document.getElementById("animation");

for (let i = 0; i < 40; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration = (5 + Math.random() * 10) + "s";
  p.style.opacity = Math.random();
  container.appendChild(p);
}

</script>

</body>
</html>
