<!DOCTYPE html>
<html>
<head>
  <title>Anonymous AI TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    /* 🔥 ANIMATION AREA */
    #animation {
      width: 100%;
      height: 60vh;
      background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffcc);
      background-size: 600% 600%;
      animation: gradientFlow 8s ease infinite;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* AD STYLES */
    .ad {
      height: 90px;
      margin: 10px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      font-size: 14px;
    }
  </style>
</head>

<body>

<!-- 🔝 TOP AD -->
<div class="ad" id="topAd">
  Top Ad Slot (Ethical Ads coming)
</div>

<!-- 🎬 ANIMATION (REPLACES VIDEO) -->
<div id="animation"></div>

<!-- 🔻 BOTTOM AD -->
<div class="ad" id="bottomAd">
  Bottom Ad Slot (Ethical Ads coming)
</div>

<script>
let lastRefresh = Date.now();

function refreshAds() {
  const now = Date.now();

  // refresh every 2 minutes ONLY if page visible
  if (
    now - lastRefresh >= 120000 &&
    document.visibilityState === "visible"
  ) {
    console.log("Refreshing ads...");

    document.getElementById("topAd").innerText =
      "Top Ad Refreshed " + new Date().toLocaleTimeString();

    document.getElementById("bottomAd").innerText =
      "Bottom Ad Refreshed " + new Date().toLocaleTimeString();

    lastRefresh = now;
  }
}

// check every 10 seconds
setInterval(refreshAds, 10000);
</script>

</body>
</html>
