<!DOCTYPE html>
<html>
<head>
  <title>Anonymous AI TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    #video {
      width: 100%;
      height: 60vh;
      background: black;
    }

    .ad {
      height: 90px;
      margin: 10px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      font-size: 14px;
    }
  </style>
</head>

<body>

<!-- TOP AD -->
<div class="ad" id="topAd">
  Top Ad Slot (Ethical Ads later)
</div>

<!-- VIDEO -->
<video id="video" autoplay muted></video>

<!-- BOTTOM AD -->
<div class="ad" id="bottomAd">
  Bottom Ad Slot (Ethical Ads later)
</div>

<script>
const videos = [
  
"https://drive.google.com/file/d/1TR9FpdulMJbf_1a8DEwyKStSS9FuuKVh/view?usp=drivesdk",
  "https://drive.google.com/file/d/1TR9FpdulMJbf_1a8DEwyKStSS9FuuKVh/view?usp=drivesdk"
];

let index = 0;
const video = document.getElementById("video");

// play next video in loop
function playVideo() {
  video.src = videos[index];
  video.play();

  index = (index + 1) % videos.length;
}

video.onended = playVideo;

// start
playVideo();

// ad refresh logic (basic)
let lastRefresh = Date.now();

setInterval(() => {
  if (Date.now() - lastRefresh > 120000) {
    document.getElementById("topAd").innerText =
      "Top Ad Refreshed " + new Date().toLocaleTimeString();

    document.getElementById("bottomAd").innerText =
      "Bottom Ad Refreshed " + new Date().toLocaleTimeString();

    lastRefresh = Date.now();
  }
}, 10000);
</script>

</body>
</html>
